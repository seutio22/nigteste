# Portal do colaborador: projeto Railway amusing-flexibility (Postgres + portal-colaborador-api).
# Não usar perpetual-imagination para este serviço — lá fica demandas/Nexus.
#
# Monorepo: sem isso o CLI envia a raiz do Git e o build usa nigteste/railway.json (demandas-api).
# Deploy: railway up . --path-as-root --detach
#
# GitHub + Root Directory "portal-api": o repo seutio22/nigteste tem branch PADRÃO = gh-pages (sem portal-api).
# O código da API está em main. No Railway: Settings → Source → Branch = main (ou no GitHub mude o default branch para main).
[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile"

[deploy]
startCommand = "npx prisma migrate deploy && node dist/index.js"
restartPolicyType = "ON_FAILURE"

[env]
NODE_ENV = "production"
