# portal-colaborador-api — No painel Railway: Root Directory = portal-api, branch main.
# CLI: na RAIZ do repo Git (pasta que contém portal-api/), rode: npx railway up --ci …
# NÃO use ./portal-api --path-as-root com esse Root Directory — causa "Could not find root directory: portal-api".
#
# Build: Dockerfile nesta pasta. Se o serviço usar raiz do repo vazio, ver Dockerfile.portal-colaborador-api na raiz do monorepo.
[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile"

[deploy]
healthcheckPath = "/health"
restartPolicyType = "ON_FAILURE"
