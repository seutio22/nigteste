# portal-colaborador-api — Railway com Root Directory = portal-api (este diretório).
# Build: Dockerfile na mesma pasta. Branch: main.
#
# Se o serviço usar raiz do repo vazio, usa-se Dockerfile.portal-colaborador-api na raiz (ver railway.toml do repo).
[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile"

[deploy]
healthcheckPath = "/health"
restartPolicyType = "ON_FAILURE"
