# portal-colaborador-api — Dockerfile e build nesta pasta.
#
# Painel Railway → Root Directory:
#   • Valor recomendado: portal-api (sem "/" no início — não use "/portal-api").
#   • Com este valor, o deploy por CLI deve enviar o monorepo inteiro (ver deploy-railway.ps1: `up .`).
#
# Root Directory VAZIO + deploy pela raiz do Git: use o ficheiro na raiz do repo
#   railway.stack-portal-from-repo-root.toml (Config as code) + Dockerfile.portal-colaborador-api.
#
[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile"

[deploy]
healthcheckPath = "/health"
restartPolicyType = "ON_FAILURE"
