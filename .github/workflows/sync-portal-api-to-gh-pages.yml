# Copia portal-api e portal-web de main → branch gh-pages (manual apenas).
#
# Antes: push em main com alterações em portal-web disparava sync e um push em gh-pages —
# confundia com deploy do Nexus / GitHub Pages quando o trabalho era só no portal (Vercel CLI).
# Use «Run workflow» quando precisar do branch gh-pages (ex.: Railway ligado a gh-pages).
name: Sync portal (api + web) → gh-pages

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Copiar portal-api e portal-web de main para gh-pages e push
        run: |
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"

          git fetch origin gh-pages
          git checkout -B gh-pages origin/gh-pages

          git checkout origin/main -- portal-api portal-web
          git add portal-api portal-web

          if git diff --staged --quiet; then
            echo "Nada a commitar (portal-api e portal-web já iguais ao main)."
            exit 0
          fi

          git commit -m "chore: sync portal-api e portal-web from main (manual)"
          git push origin gh-pages
