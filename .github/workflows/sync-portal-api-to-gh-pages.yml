# Mantém portal-api e portal-web no branch gh-pages (quando esse é o branch padrão do repo).
# Não confundir com GitHub Pages: o workflow «Deploy GitHub Pages» (demandas-web / Nexus) não
# dispara automaticamente ao dar push neste branch — só se correr manualmente no GitHub.
name: Sync portal (api + web) → gh-pages

on:
  push:
    branches: [main]
    paths:
      - "portal-api/**"
      - "portal-web/**"
      - ".github/workflows/sync-portal-api-to-gh-pages.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Copiar portal-api e portal-web de main para gh-pages e push
        run: |
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"

          git fetch origin gh-pages
          git checkout -B gh-pages origin/gh-pages

          git checkout origin/main -- portal-api portal-web
          git add portal-api portal-web

          if git diff --staged --quiet; then
            echo "Nada a commitar (portal-api e portal-web já iguais ao main)."
            exit 0
          fi

          git commit -m "chore: sync portal-api e portal-web from main (Railway/Vercel root)"
          git push origin gh-pages
