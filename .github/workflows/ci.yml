name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  backend:
    name: API - Build & Typecheck
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: demandas-api
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: |
            demandas-api/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Prisma generate
        run: npx prisma generate

      - name: Typecheck (tsc)
        run: npx tsc -p tsconfig.json --noEmit

      - name: Build
        run: |
          if [ -f package.json ] && jq -e '.scripts.build' package.json >/dev/null; then
            npm run build
          else
            npx tsc -p tsconfig.json
          fi

      - name: Upload dist artifact
        if: success() && hashFiles('dist/**') != ''
        uses: actions/upload-artifact@v4
        with:
          name: demandas-api-dist
          path: demandas-api/dist

  frontend:
    name: WEB - Typecheck
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: demandas-web
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: |
            demandas-web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Typecheck (tsc)
        run: |
          if [ -f tsconfig.json ]; then
            npx tsc -p tsconfig.json --noEmit
          else
            echo "tsconfig.json não encontrado, pulando typecheck";
          fi

      - name: Build (optional)
        run: |
          if [ -f package.json ] && jq -e '.scripts.build' package.json >/dev/null; then
            npm run build --if-present || true
          fi


