# Deploy produção: Railway (demandas-api) + Vercel (demandas-web).
# Antes existiam dois workflows colados neste ficheiro (chaves `name`/`on`/`jobs` duplicadas) — inválido em YAML.

name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      action:
        description: "Ação"
        required: true
        default: deploy
        type: choice
        options:
          - deploy
          - rollback
      service:
        description: "Serviço Railway (só rollback)"
        required: false
        default: nigteste
      deploy_backend:
        description: "Deploy backend (Railway)"
        required: false
        type: boolean
        default: true
      deploy_frontend:
        description: "Deploy frontend (Vercel)"
        required: false
        type: boolean
        default: true

concurrency:
  group: deploy-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  NODE_VERSION: "20"
  BACKEND_DIR: demandas-api
  FRONTEND_DIR: demandas-web

jobs:
  rollback:
    name: Rollback Railway
    runs-on: ubuntu-latest
    timeout-minutes: 15
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.action == 'rollback'
    steps:
      - name: Promover deploy anterior
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${RAILWAY_TOKEN}" ]; then echo "::error::RAILWAY_TOKEN não configurado"; exit 1; fi
          npm i -g @railway/cli
          S="${{ github.event.inputs.service }}"
          railway deployment list --service "$S" --json | jq '.[1] // empty' > prev.json
          if [ ! -s prev.json ]; then echo "Nenhum deploy anterior encontrado"; exit 1; fi
          DEPLOY_ID=$(jq -r '.id' prev.json)
          echo "Promovendo $DEPLOY_ID"
          railway deployment promote "$DEPLOY_ID" --service "$S"

  validate:
    name: Validar e decidir deploys
    runs-on: ubuntu-latest
    if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && github.event.inputs.action == 'deploy')
    outputs:
      should-deploy-backend: ${{ steps.check.outputs.should-deploy-backend }}
      should-deploy-frontend: ${{ steps.check.outputs.should-deploy-frontend }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detectar alterações e inputs
        id: check
        run: |
          set -euo pipefail
          BE="${{ env.BACKEND_DIR }}"
          FE="${{ env.FRONTEND_DIR }}"
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "should-deploy-backend=${{ github.event.inputs.deploy_backend }}" >> "$GITHUB_OUTPUT"
            echo "should-deploy-frontend=${{ github.event.inputs.deploy_frontend }}" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if ! git rev-parse --verify HEAD~1 >/dev/null 2>&1; then
            echo "should-deploy-backend=true" >> "$GITHUB_OUTPUT"
            echo "should-deploy-frontend=true" >> "$GITHUB_OUTPUT"
            echo "Sem HEAD~1: deploy completo"
            exit 0
          fi
          if git diff --quiet HEAD~1 HEAD -- "$BE"; then
            echo "should-deploy-backend=false" >> "$GITHUB_OUTPUT"
          else
            echo "should-deploy-backend=true" >> "$GITHUB_OUTPUT"
          fi
          if git diff --quiet HEAD~1 HEAD -- "$FE"; then
            echo "should-deploy-frontend=false" >> "$GITHUB_OUTPUT"
          else
            echo "should-deploy-frontend=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Verificar secrets necessários
        run: |
          set -euo pipefail
          if [ "${{ steps.check.outputs.should-deploy-backend }}" = "true" ]; then
            if [ -z "${{ secrets.RAILWAY_TOKEN }}" ]; then
              echo "::error::RAILWAY_TOKEN não configurado"
              exit 1
            fi
          fi
          if [ "${{ steps.check.outputs.should-deploy-frontend }}" = "true" ]; then
            if [ -z "${{ secrets.VERCEL_TOKEN }}" ] || [ -z "${{ secrets.VERCEL_ORG_ID }}" ] || [ -z "${{ secrets.VERCEL_PROJECT_ID }}" ]; then
              echo "::error::Secrets Vercel incompletos (VERCEL_TOKEN, VERCEL_ORG_ID, VERCEL_PROJECT_ID)"
              exit 1
            fi
          fi

  deploy-backend:
    name: Deploy API (Railway)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: validate
    if: needs.validate.result == 'success' && needs.validate.outputs.should-deploy-backend == 'true'
    defaults:
      run:
        working-directory: demandas-api
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: ${{ env.BACKEND_DIR }}/package-lock.json

      - name: Instalar dependências
        run: npm ci

      - name: Prisma generate
        run: npx prisma generate

      - name: Build (validação antes do upload)
        run: npm run build

      - name: Instalar Railway CLI
        run: npm i -g @railway/cli

      - name: Deploy para Railway
        working-directory: .
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
        run: railway up --ci --path-as-root . --service="nigteste"

  deploy-frontend:
    name: Deploy WEB (Vercel)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: validate
    if: needs.validate.result == 'success' && needs.validate.outputs.should-deploy-frontend == 'true'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: ${{ env.FRONTEND_DIR }}/package-lock.json

      - name: Instalar dependências
        working-directory: ${{ env.FRONTEND_DIR }}
        run: npm ci

      - name: Build
        working-directory: ${{ env.FRONTEND_DIR }}
        run: npm run build

      - name: Deploy para Vercel
        uses: amondnet/vercel-action@v25
        with:
          vercel-token: ${{ secrets.VERCEL_TOKEN }}
          vercel-org-id: ${{ secrets.VERCEL_ORG_ID }}
          vercel-project-id: ${{ secrets.VERCEL_PROJECT_ID }}
          working-directory: ${{ env.FRONTEND_DIR }}
          vercel-args: "--prod --yes --force"

  notify:
    name: Resumo
    runs-on: ubuntu-latest
    needs: [validate, deploy-backend, deploy-frontend]
    if: always() && needs.validate.result == 'success'
    steps:
      - name: Escrever resumo
        run: |
          {
            echo "## Deploy"
            echo ""
            case "${{ needs.deploy-backend.result }}" in
              success) echo "- **Backend (Railway)**: OK" ;;
              skipped) echo "- **Backend (Railway)**: ignorado" ;;
              *) echo "- **Backend (Railway)**: falhou ou cancelado (${{ needs.deploy-backend.result }})" ;;
            esac
            case "${{ needs.deploy-frontend.result }}" in
              success) echo "- **Frontend (Vercel)**: OK" ;;
              skipped) echo "- **Frontend (Vercel)**: ignorado" ;;
              *) echo "- **Frontend (Vercel)**: falhou ou cancelado (${{ needs.deploy-frontend.result }})" ;;
            esac
          } >> "$GITHUB_STEP_SUMMARY"
