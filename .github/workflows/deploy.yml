name: Deploy

on:
  workflow_dispatch:
    inputs:
      action:
        description: 'deploy | rollback'
        required: false
        default: 'deploy'
      service:
        description: 'Nome do serviço Railway (opcional)'
        required: false
        default: 'nigteste'
  push:
    branches: [ main ]

jobs:
  deploy-railway:
    if: ${{ secrets.RAILWAY_TOKEN != '' }}
    name: Deploy API to Railway
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: demandas-api
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: demandas-api/package-lock.json

      - name: Install deps
        run: npm ci

      - name: Build
        run: |
          if [ -f package.json ] && jq -e '.scripts.build' package.json >/dev/null; then
            npm run build
          else
            npx tsc -p tsconfig.json
          fi

      - name: Install Railway CLI
        run: npm i -g @railway/cli

      - name: Deploy to Railway
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
        run: |
          railway up --service="nigteste" --ci

  deploy-vercel:
    if: ${{ secrets.VERCEL_TOKEN != '' && secrets.VERCEL_ORG_ID != '' && secrets.VERCEL_PROJECT_ID != '' }}
    name: Deploy WEB to Vercel
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: demandas-web
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: demandas-web/package-lock.json

      - name: Install deps
        run: npm ci

      - name: Build (optional)
        run: npm run build --if-present || true

      - name: Install Vercel CLI
        run: npm i -g vercel

      - name: Deploy to Vercel
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: |
          vercel pull --yes --environment=production --token "$VERCEL_TOKEN"
          vercel deploy --prod --token "$VERCEL_TOKEN" --confirm

  rollback:
    # Gatilho manual: workflow_dispatch com action=rollback
    if: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.action == 'rollback' }}
    name: Rollback rápido
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Railway CLI (se houver token)
        if: ${{ secrets.RAILWAY_TOKEN != '' }}
        run: npm i -g @railway/cli

      - name: Railway rollback (promover release anterior)
        if: ${{ secrets.RAILWAY_TOKEN != '' }}
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
        run: |
          SERVICE_NAME="${{ github.event.inputs.service }}"
          echo "⏪ Buscando últimas implantações do serviço $SERVICE_NAME"
          railway deployment list --service "$SERVICE_NAME" --json | jq '.[1] // empty' > prev.json
          if [ ! -s prev.json ]; then echo 'Nenhum deploy anterior encontrado'; exit 1; fi
          DEPLOY_ID=$(jq -r '.id' prev.json)
          echo "Promovendo deploy $DEPLOY_ID"
          railway deployment promote "$DEPLOY_ID" --service "$SERVICE_NAME"

      - name: Vercel rollback (reativar build anterior via alias)
        if: ${{ secrets.VERCEL_TOKEN != '' && secrets.VERCEL_ORG_ID != '' && secrets.VERCEL_PROJECT_ID != '' }}
        run: |
          npm i -g vercel
          # Obtém a segunda implantação mais recente e faz alias para produção
          PREV_URL=$(vercel ls --token "${{ secrets.VERCEL_TOKEN }}" --confirm | awk 'NR==3{print $1}')
          if [ -z "$PREV_URL" ]; then echo 'Não foi possível obter build anterior do Vercel'; exit 1; fi
          vercel alias set "$PREV_URL" $(vercel project ls --token "${{ secrets.VERCEL_TOKEN }}" | awk 'NR==2{print $1}') --token "${{ secrets.VERCEL_TOKEN }}" || true

name: 🚀 Deploy Automático - Railway & Vercel

on:
  push:
    branches: [ main, master, gh-pages ]
  pull_request:
    branches: [ main, master, gh-pages ]
  workflow_dispatch:
    inputs:
      deploy_backend:
        description: 'Deploy Backend (Railway)'
        required: true
        default: true
        type: boolean
      deploy_frontend:
        description: 'Deploy Frontend (Vercel)'
        required: true
        default: true
        type: boolean

env:
  NODE_VERSION: '18'
  BACKEND_DIR: './demandas-api'
  FRONTEND_DIR: './demandas-web'

jobs:
  # Job de validação e preparação
  validate:
    runs-on: ubuntu-latest
    name: 🔍 Validação e Preparação
    outputs:
      should-deploy-backend: ${{ steps.check.outputs.should-deploy-backend }}
      should-deploy-frontend: ${{ steps.check.outputs.should-deploy-frontend }}
    
    steps:
    - name: 📥 Checkout código
      uses: actions/checkout@v4
      with:
        fetch-depth: 0
    
    - name: 🔍 Verificar mudanças
      id: check
      run: |
        echo "Verificando mudanças nos diretórios..."
        
        # Verificar se há mudanças no backend
        if git diff --quiet HEAD~1 HEAD -- ${{ env.BACKEND_DIR }}; then
          echo "should-deploy-backend=false" >> $GITHUB_OUTPUT
          echo "❌ Nenhuma mudança no backend"
        else
          echo "should-deploy-backend=true" >> $GITHUB_OUTPUT
          echo "✅ Mudanças detectadas no backend"
        fi
        
        # Verificar se há mudanças no frontend
        if git diff --quiet HEAD~1 HEAD -- ${{ env.FRONTEND_DIR }}; then
          echo "should-deploy-frontend=false" >> $GITHUB_OUTPUT
          echo "❌ Nenhuma mudança no frontend"
        else
          echo "should-deploy-frontend=true" >> $GITHUB_OUTPUT
          echo "✅ Mudanças detectadas no frontend"
        fi
    
    - name: 🔧 Verificar secrets necessários
      run: |
        echo "Verificando configuração dos secrets..."
        
        if [ "${{ github.event.inputs.deploy_backend }}" = "true" ] || [ "${{ steps.check.outputs.should-deploy-backend }}" = "true" ]; then
          if [ -z "${{ secrets.RAILWAY_TOKEN }}" ]; then
            echo "❌ RAILWAY_TOKEN não configurado"
            exit 1
          fi
          echo "✅ RAILWAY_TOKEN configurado"
        fi
        
        if [ "${{ github.event.inputs.deploy_frontend }}" = "true" ] || [ "${{ steps.check.outputs.should-deploy-frontend }}" = "true" ]; then
          if [ -z "${{ secrets.VERCEL_TOKEN }}" ] || [ -z "${{ secrets.VERCEL_ORG_ID }}" ] || [ -z "${{ secrets.VERCEL_PROJECT_ID }}" ]; then
            echo "❌ Secrets do Vercel não configurados"
            exit 1
          fi
          echo "✅ Secrets do Vercel configurados"
        fi

  # Deploy do Backend (Railway)
  deploy-backend:
    runs-on: ubuntu-latest
    name: 🚂 Deploy Backend (Railway)
    needs: validate
    if: ${{ needs.validate.outputs.should-deploy-backend == 'true' || github.event.inputs.deploy_backend == 'true' }}
    
    steps:
    - name: 📥 Checkout código
      uses: actions/checkout@v4
    
    - name: 🟢 Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: ${{ env.NODE_VERSION }}
        cache: 'npm'
        cache-dependency-path: ${{ env.BACKEND_DIR }}/package-lock.json
    
    - name: 📦 Instalar dependências
      working-directory: ${{ env.BACKEND_DIR }}
      run: |
        echo "Instalando dependências do backend..."
        npm ci --prefer-offline --no-audit
    
    - name: 🗄️ Gerar cliente Prisma
      working-directory: ${{ env.BACKEND_DIR }}
      run: |
        echo "Gerando cliente Prisma..."
        npx prisma generate --force
    
    - name: 🏗️ Build do Backend
      working-directory: ${{ env.BACKEND_DIR }}
      run: |
        echo "Fazendo build do backend..."
        npm run build
    
    - name: 🚀 Deploy para Railway (da raiz do repo - railway.json com rootDirectory)
      env:
        RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
      run: |
        npm i -g @railway/cli
        railway up --service="nigteste" --ci

  # Deploy do Frontend (Vercel)
  deploy-frontend:
    runs-on: ubuntu-latest
    name: 🌐 Deploy Frontend (Vercel)
    needs: validate
    if: ${{ needs.validate.outputs.should-deploy-frontend == 'true' || github.event.inputs.deploy_frontend == 'true' }}
    
    steps:
    - name: 📥 Checkout código
      uses: actions/checkout@v4
    
    - name: 🟢 Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: ${{ env.NODE_VERSION }}
        cache: 'npm'
        cache-dependency-path: ${{ env.FRONTEND_DIR }}/package-lock.json
    
    - name: 📦 Instalar dependências
      working-directory: ${{ env.FRONTEND_DIR }}
      run: |
        echo "Instalando dependências do frontend..."
        npm ci --prefer-offline --no-audit
    
    - name: 🏗️ Build do Frontend
      working-directory: ${{ env.FRONTEND_DIR }}
      run: |
        echo "Fazendo build do frontend..."
        npm run build
    
    - name: 🚀 Deploy para Vercel
      uses: amondnet/vercel-action@v25
      with:
        vercel-token: ${{ secrets.VERCEL_TOKEN }}
        vercel-org-id: ${{ secrets.VERCEL_ORG_ID }}
        vercel-project-id: ${{ secrets.VERCEL_PROJECT_ID }}
        working-directory: ${{ env.FRONTEND_DIR }}
        vercel-args: '--prod'
      continue-on-error: true
    
    - name: ✅ Verificar deploy do frontend
      if: always()
      run: |
        if [ $? -eq 0 ]; then
          echo "🎉 Frontend deployado com sucesso no Vercel!"
        else
          echo "❌ Erro no deploy do frontend"
          exit 1
        fi

  # Job de notificação final
  notify:
    runs-on: ubuntu-latest
    name: 📢 Notificação Final
    needs: [validate, deploy-backend, deploy-frontend]
    if: always()
    
    steps:
    - name: 📋 Resumo do Deploy
      run: |
        echo "## 🚀 Resumo do Deploy" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        
        if [ "${{ needs.deploy-backend.result }}" = "success" ]; then
          echo "✅ **Backend**: Deployado com sucesso no Railway" >> $GITHUB_STEP_SUMMARY
        elif [ "${{ needs.deploy-backend.result }}" = "skipped" ]; then
          echo "⏭️ **Backend**: Pulado (sem mudanças)" >> $GITHUB_STEP_SUMMARY
        else
          echo "❌ **Backend**: Falha no deploy" >> $GITHUB_STEP_SUMMARY
        fi
        
        if [ "${{ needs.deploy-frontend.result }}" = "success" ]; then
          echo "✅ **Frontend**: Deployado com sucesso no Vercel" >> $GITHUB_STEP_SUMMARY
        elif [ "${{ needs.deploy-frontend.result }}" = "skipped" ]; then
          echo "⏭️ **Frontend**: Pulado (sem mudanças)" >> $GITHUB_STEP_SUMMARY
        else
          echo "❌ **Frontend**: Falha no deploy" >> $GITHUB_STEP_SUMMARY
        fi
        
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "🕐 **Timestamp**: $(date)" >> $GITHUB_STEP_SUMMARY
