# Publica o frontend NEXUS (demandas-web) no GitHub Pages — APENAS manual.
#
# Antes: disparava em push para main / master / gh-pages. Isto fazia com que cada push em main
# (ou sync portal → gh-pages) republicasse o Nexus no Pages, confundindo com o portal do colaborador.
# O portal real está em portal-web (Vercel + CLI); GitHub Pages não faz parte desse fluxo.
name: Deploy GitHub Pages (Nexus — só manual)

on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "18"
          cache: "npm"
          cache-dependency-path: demandas-web/package-lock.json

      - name: Install dependencies
        working-directory: ./demandas-web
        run: npm ci

      - name: Build
        working-directory: ./demandas-web
        run: npm run build

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: demandas-web/dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
