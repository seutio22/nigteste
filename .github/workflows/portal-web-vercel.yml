# DESATIVADO para push: o deploy do portal do colaborador é feito só por CLI local.
# Fluxo normal (PowerShell, na raiz do repo):
#   .\scripts\deploy-portal-web.ps1
#   .\scripts\deploy-portal-web.ps1 -KillNode -Clean
#
# Este ficheiro mantém apenas workflow_dispatch para emergência (requer secrets no GitHub).
#
# Secrets (se usar manualmente): VERCEL_TOKEN, VERCEL_ORG_ID, VERCEL_PROJECT_ID_PORTAL_WEB
#
# Painel Vercel: com deploy pela pasta portal-web (CLI ou zip só desta app), Root Directory = vazio.

on:
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    if: ${{ secrets.VERCEL_TOKEN != '' && secrets.VERCEL_PROJECT_ID_PORTAL_WEB != '' && secrets.VERCEL_ORG_ID != '' }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: portal-web/package-lock.json

      - name: Instalar dependências
        working-directory: portal-web
        run: npm ci

      - name: Build
        working-directory: portal-web
        run: npm run build

      - name: Deploy Vercel (produção)
        uses: amondnet/vercel-action@v25
        with:
          vercel-token: ${{ secrets.VERCEL_TOKEN }}
          vercel-org-id: ${{ secrets.VERCEL_ORG_ID }}
          vercel-project-id: ${{ secrets.VERCEL_PROJECT_ID_PORTAL_WEB }}
          working-directory: ./portal-web
          vercel-args: "--prod --yes --force"
