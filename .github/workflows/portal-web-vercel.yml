# Deploy do portal do colaborador (portal-web) na Vercel.
# Secrets no GitHub (Settings → Secrets → Actions):
#   VERCEL_TOKEN — token da Vercel
#   VERCEL_ORG_ID — team id (ex. team_xxx), pode ser o mesmo de ORG_ID do Nexus
#   VERCEL_PROJECT_ID_PORTAL_WEB — id do projeto "portal-web" no painel Vercel (prj_xxx)
# Monorepo: não há vercel.json na raiz (evita build demandas-web/Nexus no projeto errado).
#
# ROOT DIRECTORY NO PAINEL VERCEL (crítico):
# • Este workflow envia o ZIP já com raiz = pasta portal-web → no projeto Vercel deixe
#   «Root Directory» VAZIO. Se puser «portal-web», a build procura portal-web/ dentro do zip → falha/404.
# • Deploy do Nexus usa outro projeto Vercel com Root Directory = demandas-web.
#
# bump: 2026-05-02d (vercel.json portal completo; doc Root Directory vazio p/ Actions)

on:
  push:
    branches: [main]
    paths:
      - "portal-web/**"
      - ".github/workflows/portal-web-vercel.yml"
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    if: ${{ secrets.VERCEL_TOKEN != '' && secrets.VERCEL_PROJECT_ID_PORTAL_WEB != '' && secrets.VERCEL_ORG_ID != '' }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: portal-web/package-lock.json

      - name: Instalar dependências
        working-directory: portal-web
        run: npm ci

      - name: Build
        working-directory: portal-web
        run: npm run build

      # Root Directory no painel: vazio (o zip já é só portal-web).
      - name: Deploy Vercel (produção)
        uses: amondnet/vercel-action@v25
        with:
          vercel-token: ${{ secrets.VERCEL_TOKEN }}
          vercel-org-id: ${{ secrets.VERCEL_ORG_ID }}
          vercel-project-id: ${{ secrets.VERCEL_PROJECT_ID_PORTAL_WEB }}
          working-directory: ./portal-web
          vercel-args: "--prod --yes --force"
