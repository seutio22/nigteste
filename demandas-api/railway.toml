[build]
builder = "nixpacks"
buildCommand = "echo 'FORCING CACHE CLEAR v23' && rm -rf dist && npm run build && echo 'BUILD COMPLETED v23 - DIST CLEANED'"

[deploy]
startCommand = "npm start"
healthcheckPath = "/health"
healthcheckTimeout = 300
restartPolicyType = "on_failure"

[env]
NODE_ENV = "production"
NO_CACHE = "1"

