[build]
builder = "nixpacks"
buildCommand = "echo 'FORCING CACHE CLEAR v22' && npm run build && echo 'BUILD COMPLETED v22 - CACHE CLEARED'"

[deploy]
startCommand = "npm start"
healthcheckPath = "/health"
healthcheckTimeout = 300
restartPolicyType = "on_failure"

[env]
NODE_ENV = "production"
NO_CACHE = "1"

