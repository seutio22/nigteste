# =============================================================================
# ATENÇÃO (Railpack / Docker monorepo)
#
# Erro comum no build: `"/package.json": not found`
#   → Root Directory vazio no painel + Dockerfile desta pasta (COPY package.json na raiz).
#   → Corrigir: Settings → Config as code = /railway.stack-demandas-from-repo-root.toml
#     (usa Dockerfile.demandas-api na raiz do repo) OU Root Directory = demandas-api
#     e deploy com deploy-railway-direto.ps1 na raiz do monorepo.
#
# Não adicione `railpack.json` nem `nixpacks.toml` nesta pasta.
#
# Opção A — Root Directory = demandas-api
#   Config as code: /demandas-api/railway.toml
#   Deploy: .\deploy-railway-direto.ps1 (na raiz do repo)
#
# Opção B — Root Directory vazio (recomendado se o build falhar)
#   Config as code: /railway.stack-demandas-from-repo-root.toml
#
# Se o builder ignorar o Dockerfile: RAILWAY_DOCKERFILE_PATH=Dockerfile
# =============================================================================

[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile"

[deploy]
startCommand = "node scripts/start-production.cjs"
restartPolicyType = "on_failure"

[env]
NODE_ENV = "production"
